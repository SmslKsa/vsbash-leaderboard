name: Publish VSBASH leaderboard
on:
  push:
    branches: [main]
    paths: ['data/**', 'build.mjs', 'build.test.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vsbash-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify ranking and progression rules
        run: node --test build.test.mjs
      - name: Build approved public snapshot
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public leaderboard
        id: deployment
        uses: actions/deploy-pages@v4
